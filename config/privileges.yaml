# Privilege Configuration for WE-Dashboard
# This file defines the privilege hierarchy, data scoping, and feature access rules.
#
# Configuration based on: docs/privileges_configuration.md
#
# Four tables define data access:
# 1. Data Scope by Privilege and Tab - controls which data is visible per tab
# 2. Data Scope by Grouping local filter - controls which data is visible per grouping option
# 3. Data Scope by Section - controls which data is visible in specific UI sections
#    (計測値, 主な指標, アクション対象候補, 気になった出来事や気づき, 共有したいこと)

# Grade groups for filtering
grade_groups:
  non_managers:
    - サプライヤー
    - 一般職
    - 主任
    - 主事補
    - 主事
    - 主管
  managers:
    - 特命職
    - 特命職・専門職
    - エキスパート
    - 課長
    - 部長

# Section aliases for grouped display in 課別 grouping
# Note: dev (department head) sees individual sections, NOT combined aliases
# All section managers in 開発部 (dev1, dev2, uti, uks1) see BOTH combined aliases
section_aliases:
  開発部_1課_combined:
    display_name: "開発部 1課・UTI技術発展処"
    members:
      - 開発部 1課
      - UTI技術発展処
    visible_to:
      - dev1
      - dev2
      - uti
      - uks1
    visible_in_tabs:
      - 時系列
      - グループ比較
      - 評価
      - 分布

  開発部_2課_combined:
    display_name: "開発部 2課・UK S1-Project"
    members:
      - 開発部 2課
      - UK S1-Project
    visible_to:
      - dev1
      - dev2
      - uti
      - uks1
    visible_in_tabs:
      - 時系列
      - グループ比較
      - 評価
      - 分布

# Privilege class definitions
privileges:
  # Admin - full access to everything
  admin:
    tabs:
      allowed: all
    data_scope:
      default:
        type: all
    section_scope:
      計測値:
        type: all
      主な指標:
        type: all
      アクション対象候補:
        type: all
      共有したいこと:
        type: all
    groupings:
      allowed: all
    features:
      気になった出来事や気づき: true
      共有したいこと:
        access: true
        anonymize: false

  # Department Head - access to their department(s)
  department_head:
    tabs:
      allowed: all
    data_scope:
      default:
        type: organization
        # values will be inherited from user_privileges
    section_scope:
      計測値:
        type: organization
      主な指標:
        type: organization
      アクション対象候補:
        type: organization
      共有したいこと:
        type: organization
    groupings:
      allowed: all
    features:
      気になった出来事や気づき: false
      共有したいこと:
        access: true
        anonymize: false

  # Section Manager - different data scope per tab and section
  section_manager:
    inherits: department_head
    tabs:
      allowed: all
    data_scope:
      # Wider view for trend/comparison tabs (department level)
      時系列:
        type: organization
      グループ比較:
        type: organization
      評価:
        type: organization
      # Narrower view for individual/distribution tabs (section level)
      個人:
        type: organization
      分布:
        type: organization
      default:
        type: organization
    section_scope:
      計測値:
        type: organization
        # Uses wide scope (department level)
      主な指標:
        type: organization
        # Uses wide scope (department level)
      アクション対象候補:
        type: organization
        # Uses wide scope for department heads, narrow for section managers
      共有したいこと:
        type: organization
        # Uses narrow scope (section level)
    groupings:
      allowed: all
    auto_reset_filters:
      on_tab_change:
        from:
          - 時系列
          - グループ比較
          - 評価
        to:
          - 個人
          - 分布
        reset_to: user_section
    features:
      気になった出来事や気づき: false
      共有したいこと:
        access: true
        anonymize: false

  # Member - restricted access (no 個人/分布 tabs, grade filtering in 職位別)
  member:
    inherits: section_manager
    tabs:
      allowed:
        - 時系列
        - グループ比較
        - 評価
      denied:
        - 個人
        - 分布
    data_scope:
      default:
        type: organization
    section_scope:
      計測値:
        type: organization
      主な指標:
        type: organization
      アクション対象候補:
        type: none
      共有したいこと:
        type: organization
    groupings:
      allowed:
        - なし
        - department
        - section
        - team
        - project
        - grade
      denied:
        - name
      grade_filter:
        type: include
        values_from: non_managers
    features:
      気になった出来事や気づき: false
      共有したいこと:
        access: true
        anonymize: true

  # Member without grade filter (for develop privilege)
  member_no_grade_filter:
    inherits: section_manager
    tabs:
      allowed:
        - 時系列
        - グループ比較
        - 評価
      denied:
        - 個人
        - 分布
    data_scope:
      default:
        type: organization
    section_scope:
      計測値:
        type: organization
      主な指標:
        type: organization
      アクション対象候補:
        type: none
      共有したいこと:
        type: none
    groupings:
      allowed:
        - なし
        - department
        - section
        - team
        - project
        - grade
      denied:
        - name
      # No grade_filter - can see all grades
    features:
      気になった出来事や気づき: false
      共有したいこと:
        access: false
        anonymize: true

  # Anonymous - no data access
  anonymous:
    tabs:
      allowed: []
    data_scope:
      default:
        type: none
    section_scope:
      計測値:
        type: none
      主な指標:
        type: none
      アクション対象候補:
        type: none
      共有したいこと:
        type: none
    groupings:
      allowed:
        - なし
        - department
        - section
        - team
        - project
    features:
      気になった出来事や気づき: false
      共有したいこと:
        access: false
        anonymize: true

