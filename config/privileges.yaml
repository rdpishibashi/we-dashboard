# Privilege Configuration for WE-Dashboard
# This file is auto-generated from config/privileges_configuration.md
# Do not edit this file directly - edit the markdown and run:
#   python tools/generate_privileges_yaml.py
#
# Configuration based on: config/privileges_configuration.md
#
# Four tables define data access:
# 1. Data Scope by Privilege and Tab - controls which data is visible per tab
# 2. Data Scope by Grouping local filter - controls which data is visible per grouping option
# 3. Data Scope by Section - controls which data is visible in specific UI sections
#    (計測値, 主な指標, アクション対象候補, 気になった出来事や気づき, 共有したいこと)

# Grade groups for filtering
grade_groups:
  non_managers:
  - サプライヤー
  - 一般職
  - 主任
  - 主事補
  - 主事
  - 主管
  managers:
  - 特命職
  - 特命職・専門職
  - エキスパート
  - 課長
  - 部長

# Section aliases for grouped display in 課別 grouping
# Note: dev (department head) sees individual sections, NOT combined aliases
# All section managers in 開発部 (dev1, dev2, uti, uks1) see BOTH combined aliases
section_aliases:
  開発部_1課_UTI技術発展処:
    display_name: 開発部 1課・UTI技術発展処
    members:
    - 開発部 1課
    - UTI技術発展処
    visible_to:
    - develop1
    - develop2
    visible_in_tabs:
    - 時系列
    - グループ比較
    - 評価
    - 分布
  開発部_2課_UK_S1-Project:
    display_name: 開発部 2課・UK S1-Project
    members:
    - 開発部 2課
    - UK S1-Project
    visible_to:
    - develop1
    - develop2
    visible_in_tabs:
    - 時系列
    - グループ比較
    - 評価
    - 分布

# Team-based section overrides for 課別 grouping
# Members matching the team value are moved to a virtual section
team_section_overrides:
  マネジメント:
    match_team: Management
    display_section: マネジメント
    visible_to:
    - all
    visible_in_tabs:
    - 時系列
    - グループ比較
    - 評価
    - 分布
    exclude_sections:
    - 未設定

# Privilege class definitions
privileges:
  admin:
    tabs:
      allowed: all
    data_scope:
      default:
        type: all
    section_scope:
      計測値:
        type: all
      主な指標:
        type: all
      アクション対象候補:
        type: all
      共有したいこと:
        type: all
    groupings:
      allowed: all
    features:
      気になった出来事や気づき: true
      共有したいこと:
        access: true
        anonymize: false
  department_head:
    tabs:
      allowed: all
    data_scope:
      default:
        type: organization
    section_scope:
      計測値:
        type: organization
      主な指標:
        type: organization
      アクション対象候補:
        type: organization
      共有したいこと:
        type: organization
    groupings:
      allowed: all
    features:
      気になった出来事や気づき: false
      共有したいこと:
        access: true
        anonymize: false
  section_manager:
    inherits: department_head
    tabs:
      allowed: all
    data_scope:
      時系列:
        type: organization
      グループ比較:
        type: organization
      評価:
        type: organization
      個人:
        type: organization
      分布:
        type: organization
      default:
        type: organization
    section_scope:
      計測値:
        type: organization
      主な指標:
        type: organization
      アクション対象候補:
        type: organization
      共有したいこと:
        type: organization
    groupings:
      allowed: all
    auto_reset_filters:
      on_tab_change:
        from:
        - 時系列
        - グループ比較
        - 評価
        to:
        - 個人
        - 分布
        reset_to: user_section
    features:
      気になった出来事や気づき: false
      共有したいこと:
        access: true
        anonymize: false
  member:
    inherits: section_manager
    tabs:
      allowed:
      - 時系列
      - グループ比較
      - 評価
      denied:
      - 個人
      - 分布
    data_scope:
      default:
        type: organization
    section_scope:
      計測値:
        type: organization
      主な指標:
        type: organization
      アクション対象候補:
        type: none
      共有したいこと:
        type: organization
    groupings:
      allowed:
      - なし
      - department
      - section
      - team
      - project
      - grade
      denied:
      - name
      grade_filter:
        type: include
        values_from: non_managers
    features:
      気になった出来事や気づき: false
      共有したいこと:
        access: true
        anonymize: true
  member_no_grade_filter:
    inherits: section_manager
    tabs:
      allowed:
      - 時系列
      - グループ比較
      - 評価
      denied:
      - 個人
      - 分布
    data_scope:
      default:
        type: organization
    section_scope:
      計測値:
        type: organization
      主な指標:
        type: organization
      アクション対象候補:
        type: none
      共有したいこと:
        type: none
    groupings:
      allowed:
      - なし
      - department
      - section
      - team
      - project
      - grade
      denied:
      - name
    features:
      気になった出来事や気づき: false
      共有したいこと:
        access: false
        anonymize: true
  anonymous:
    tabs:
      allowed: []
    data_scope:
      default:
        type: none
    section_scope:
      計測値:
        type: none
      主な指標:
        type: none
      アクション対象候補:
        type: none
      共有したいこと:
        type: none
    groupings:
      allowed:
      - なし
      - department
      - section
      - team
      - project
    features:
      気になった出来事や気づき: false
      共有したいこと:
        access: false
        anonymize: true

