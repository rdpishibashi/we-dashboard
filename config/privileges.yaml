# Privilege Configuration for WE-Dashboard
# This file is auto-generated from config/privileges_configuration.md
# Do not edit this file directly - edit the markdown and run:
#   python tools/generate_privileges_yaml.py
#
# Configuration based on: config/privileges_configuration.md
#
# Four tables define data access:
# 1. Data Scope by Privilege and Tab - controls which data is visible per tab
# 2. Data Scope by Grouping (= すべて) - grouping scope when no dimension filter is selected
# 3. Data Scope by Grouping (≠ すべて) - grouping scope when a specific dimension is selected
# 4. Data Scope by Section - controls which data is visible in specific UI sections
#    (計測値, 主な指標, アクション対象候補, 気になった出来事や気づき, 幹部職に伝えたいこと)

# Grade groups for filtering
grade_groups:
  non_managers:
  - サプライヤー
  - 一般職
  - 主任
  - 主事補
  - 主事
  - 主管
  managers:
  - 特命職
  - 特命職・専門職
  - エキスパート
  - 課長
  - 部長

# Section aliases for grouped display in 課別 grouping
# Note: dev (department head) sees individual sections, NOT combined aliases
# All section managers in 開発部 (dev1, dev2, uti, uks1) see BOTH combined aliases
section_aliases: {}

# Privilege class definitions
privileges:
  admin:
    tabs:
      allowed: all
    data_scope:
      default:
        type: all
    section_scope:
      計測値:
        type: all
      主な指標:
        type: all
      アクション対象候補:
        type: all
      幹部職に伝えたいこと:
        type: all
    groupings:
      allowed: all
    features:
      気になった出来事や気づき: true
      幹部職に伝えたいこと:
        access: true
        anonymize: false
        response_enabled: true
      未記入者: true
  department_head:
    tabs:
      allowed: all
    data_scope:
      default:
        type: organization
    section_scope:
      計測値:
        type: organization
      主な指標:
        type: organization
      アクション対象候補:
        type: organization
      幹部職に伝えたいこと:
        type: organization
    groupings:
      allowed: all
    features:
      気になった出来事や気づき: false
      幹部職に伝えたいこと:
        access: true
        anonymize: false
        response_enabled: true
      未記入者: true
  section_manager:
    inherits: department_head
    tabs:
      allowed: all
    data_scope:
      時系列:
        type: organization
      グループ比較:
        type: organization
      評価:
        type: organization
      個人:
        type: organization
      分布:
        type: organization
      default:
        type: organization
    section_scope:
      計測値:
        type: organization
      主な指標:
        type: organization
      アクション対象候補:
        type: organization
      幹部職に伝えたいこと:
        type: organization
    groupings:
      allowed: all
    auto_reset_filters:
      on_tab_change:
        from:
        - 時系列
        - グループ比較
        - 評価
        to:
        - 個人
        - 分布
        reset_to: user_section
    features:
      気になった出来事や気づき: false
      幹部職に伝えたいこと:
        access: true
        anonymize: false
        response_enabled: true
      未記入者: true
  member:
    inherits: section_manager
    tabs:
      allowed:
      - 時系列
      - グループ比較
      - 評価
      denied:
      - 個人
      - 分布
    data_scope:
      default:
        type: organization
    section_scope:
      計測値:
        type: organization
      主な指標:
        type: organization
      アクション対象候補:
        type: none
      幹部職に伝えたいこと:
        type: organization
    groupings:
      allowed:
      - なし
      - department
      - section
      - team
      - project
      - grade
      denied:
      - name
      grade_filter:
        type: include
        values_from: non_managers
    features:
      気になった出来事や気づき: false
      幹部職に伝えたいこと:
        access: false
        anonymize: true
        response_enabled: false
      未記入者: false
  member_no_grade_filter:
    inherits: section_manager
    tabs:
      allowed:
      - 時系列
      - グループ比較
      - 評価
      denied:
      - 個人
      - 分布
    data_scope:
      default:
        type: organization
    section_scope:
      計測値:
        type: organization
      主な指標:
        type: organization
      アクション対象候補:
        type: none
      幹部職に伝えたいこと:
        type: none
    groupings:
      allowed:
      - なし
      - department
      - section
      - team
      - project
      - grade
      denied:
      - name
    features:
      気になった出来事や気づき: false
      幹部職に伝えたいこと:
        access: false
        anonymize: true
        response_enabled: false
      未記入者: false
  anonymous:
    tabs:
      allowed: []
    data_scope:
      default:
        type: none
    section_scope:
      計測値:
        type: none
      主な指標:
        type: none
      アクション対象候補:
        type: none
      幹部職に伝えたいこと:
        type: none
    groupings:
      allowed:
      - なし
      - department
      - section
      - team
      - project
    features:
      気になった出来事や気づき: false
      幹部職に伝えたいこと:
        access: false
        anonymize: true
        response_enabled: false
      未記入者: false

